<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face { font-family: NameFont; src: url("fonts/thmanyahsans12_black.otf"); }
@font-face { font-family: Hafs; src: url("fonts/hafs.18.ttf"); }
@font-face { font-family: ThSans; src: url("fonts/thmanyahsans12_black.otf"); }
@font-face { font-family: ThSansM; src: url("fonts/thmanyahsans12_bold.otf"); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; }
.stage { position:relative; width:1920px; height:1080px; overflow:hidden; }
.layer { position:absolute; inset:0; }
.namebox svg { width:100%; height:100%; }

.stage { background:
  radial-gradient(900px 700px at 1420px 520px, #ffffff, transparent 70%),
  linear-gradient(135deg,#fbf6ea,#efe4c9); }
#name path { fill:url(#green); }
.medal { position:absolute; left:1050px; top:110px; width:780px; height:780px; border-radius:50%;
  background: radial-gradient(circle at 50% 40%, #2d8a66, #0b3b2b 75%);
  box-shadow: 0 0 0 14px #fbf6ea, 0 0 0 22px #c9a24c, 0 30px 60px rgba(60,40,0,.35); }
.medal-clip { position:absolute; left:860px; top:-200px; width:1060px; height:1090px; overflow:hidden;
  clip-path: path('M 0 0 H 1060 V 700 H 970 A 390 390 0 0 1 190 700 H 0 Z'); }
.medal-clip img { position:absolute; left:90px; top:230px; height:930px;
  filter: drop-shadow(-20px 20px 30px rgba(0,0,0,.5)); }
.left { position:absolute; left:70px; top:120px; width:900px; text-align:center; }
.small { font-family:Hafs; font-size:140px; color:#0b3b2b; line-height:1; }
.big { font-family:Hafs; font-size:340px; line-height:1.02; color:#0e4a35;
  text-shadow: 0 4px 0 #c9a24c, 0 18px 30px rgba(60,40,0,.25); }
.pill { display:inline-block; margin-top:26px; font-family:ThSans; font-size:58px; color:#fbf6ea; padding:8px 54px 16px;
  background:#0e4a35; border-radius:999px; box-shadow: 0 0 0 4px #c9a24c, 0 14px 26px rgba(0,0,0,.25); }
.namebox { position:absolute; left:70px; top:860px; width:900px; height:170px; }
.corner { position:absolute; width:160px; height:160px; border:4px solid #c9a24c; }
.namebox .name-text { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:NameFont; font-size:110px; white-space:nowrap; color:#0e4a35; }
</style></head><body><div class="stage"><svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="554" x2="0" y2="1397">
 <stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#ffe39a"/><stop offset=".7" stop-color="#d9a13d"/><stop offset="1" stop-color="#ffe7a6"/></linearGradient>
<linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="554" x2="0" y2="1397">
 <stop offset="0" stop-color="#1d6b4f"/><stop offset="1" stop-color="#0b3b2b"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff0c2"/><stop offset=".5" stop-color="#d4a650"/><stop offset="1" stop-color="#8a6420"/></linearGradient>
<pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.4">
 <rect x="40" y="40" width="60" height="60"/><rect x="40" y="40" width="60" height="60" transform="rotate(45 70 70)"/>
 <circle cx="70" cy="70" r="14"/><path d="M0 70H28M112 70H140M70 0V28M70 112V140"/></g></pattern>
</defs></svg>
<svg class="layer" width="1920" height="1080" style="color:#b58f3c"><rect width="1920" height="1080" fill="url(#stars)" opacity=".18"/></svg>
<div class="medal"></div>
<div class="medal-clip"><img src="reciter.png"></div>
<div class="left">
  <div class="small">سُورَةُ</div>
  <div class="big fit">{{SURA_NAME}}</div>
  <div class="pill">{{TAGLINE}}</div>
</div>
<div class="namebox">{{RECITER_NAME}}</div>
<div class="corner" style="left:30px;top:30px;border-right:0;border-bottom:0"></div>
<div class="corner" style="right:30px;top:30px;border-left:0;border-bottom:0"></div>
<div class="corner" style="left:30px;bottom:30px;border-right:0;border-top:0"></div>
<div class="corner" style="right:30px;bottom:30px;border-left:0;border-top:0"></div>
</div><script>
/* shrink long titles so they never overflow their box */
document.fonts.ready.then(() => {
  for (const el of document.querySelectorAll('.fit')) {
    el.style.whiteSpace = 'nowrap';
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 2 && fs > 40) { fs -= 4; el.style.fontSize = fs + 'px'; }
  }
});
</script>
</body></html>
